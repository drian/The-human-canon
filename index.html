<!doctype html><html lang="no"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>The Human Canon</title><style>
*{box-sizing:border-box}body{background:#191b19;color:#eee3ce;font:16px system-ui;margin:0}main{max-width:850px;margin:auto;padding:24px}h1{font:clamp(36px,8vw,64px) Georgia;margin:12px 0}small,.muted{color:#c5bca9}a{color:#e4c38c}input,select,button{font:inherit;color:inherit;background:#282b26;border:1px solid #55584d;border-radius:8px;padding:10px}input{flex:1;min-width:160px}nav{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0}progress{width:100%;accent-color:#c5ae80;height:12px}article{border-top:1px solid #41443b;padding:18px 0;display:grid;grid-template-columns:40px 1fr;gap:12px}article h2{font:22px Georgia;margin:0 0 6px}article p{margin:8px 0}article select{margin-top:10px}article.read h2{text-decoration:line-through;color:#a7a89c}.links{display:flex;gap:16px;flex-wrap:wrap;font-size:14px}.rank{color:#c5ae80;font:22px Georgia}footer{margin-top:30px}details{margin-top:10px}summary{cursor:pointer;color:#c5ae80}</style><main><small>THE HUMAN CANON / A LIFETIME OF READING</small><h1>Det menneskelige bibliotek</h1><p class="muted">En lesereise gjennom historie, filosofi og litteratur. Rekkefølgen er anbefalt, ikke obligatorisk.</p><p id="stats" aria-live="polite"></p><progress id="progress" value="0" max="1"></progress><nav><input id="search" type="search" placeholder="Søk etter bok eller forfatter" aria-label="Søk"><select id="category" aria-label="Kategori"><option value="">Alle kategorier</option></select><select id="filter" aria-label="Lesestatus"><option value="">Alle bøker</option><option value="unread">Ikke lest</option><option value="reading">Leser nå</option><option value="read">Lest</option></select></nav><div id="error" role="alert"></div><section id="books"></section><footer class="muted">The Human Canon · <a href="https://github.com/drian/The-human-canon">GitHub</a></footer></main><script>
const $=id=>document.getElementById(id);let books=[];
const statusNames={unread:'Ikke lest',reading:'Leser nå',read:'Lest'};
function el(tag,text,parent){const n=document.createElement(tag);if(text)n.textContent=text;if(parent)parent.append(n);return n}
function link(parent,label,url){const a=el('a',label,parent);a.href=url;a.target='_blank';a.rel='noopener noreferrer'}
function render(){const done=books.filter(b=>b.status==='read').length;$('stats').textContent=done+' av '+books.length+' bøker lest ('+Math.round(done/Math.max(1,books.length)*100)+' %)';$('progress').max=books.length||1;$('progress').value=done; const q=$('search').value.toLowerCase();const root=$('books');root.replaceChildren();for(const b of books.filter(b=>(b.title+' '+b.author).toLowerCase().includes(q)&&(!$('category').value||b.category===$('category').value)&&(!$('filter').value||b.status===$('filter').value))){const a=el('article','',root);a.className=b.status;el('span',String(b.id).padStart(2,'0'),a).className='rank';const c=el('div','',a);el('h2',b.title,c);el('small',b.author+' · '+b.year+' · '+b.category,c);el('p',b.description,c);if(b.edition)el('p','Anbefalt utgave: '+b.edition,c);const l=el('div','',c);l.className='links';const term=encodeURIComponent(b.title+' '+b.author);link(l,'Finn bok','https://openlibrary.org/search?q='+term);link(l,'Gratis utgaver','https://www.gutenberg.org/ebooks/search/?query='+term);if(b.author!=='Unknown')link(l,'Om forfatteren','https://en.wikipedia.org/w/index.php?search='+encodeURIComponent(b.author));const s=el('select','',c);s.setAttribute('aria-label','Lesestatus: '+b.title);for(const [key,label] of Object.entries(statusNames)){const o=el('option',label,s);o.value=key} s.value=b.status;s.onchange=async()=>{s.disabled=true;try{const r=await fetch('/api/progress',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:b.id,status:s.value})});if(!r.ok)throw Error();b.status=s.value;$('error').textContent='';render()}catch(e){$('error').textContent='Kunne ikke lagre. Prøv igjen.';s.value=b.status;s.disabled=false}}}if(!root.children.length)el('p','Ingen treff.',root)}
async function load(){try{const r=await fetch('/api/books');if(!r.ok)throw Error();books=await r.json();for(const cat of [...new Set(books.map(b=>b.category))]){const o=el('option',cat,$('category'));o.value=cat}render()}catch(e){$('error').textContent='Kunne ikke hente biblioteket. Last siden på nytt.'}}for(const id of ['search','category','filter'])$(id).addEventListener('input',render);load();
</script></html>
